# Локальный оверлей развёртывания (в апстрим не уходит, конфликтов при git pull не будет).
# Отличия от апстримного docker-compose.yml:
#  - signal-cli и mongo-express убраны в профили, обычным `up -d` не поднимаются;
#  - mongo не торчит наружу (только 127.0.0.1), порт 8080 бота не публикуется —
#    web_server в конфиге выключен;
#  - осмысленные имена контейнеров и ограничение логов.
services:
  supportbot:
    container_name: support-bot
    # shm-cabinet - сеть ЛК: там бэкенд доступен как backend:8000, а бот виден
    # ему как support-bot:8081. Порт моста наружу НЕ публикуется.
    networks:
      - default
      - shm-cabinet
    # Апстримный CMD - `npm run prod`, а это `tsc && node build/index.js`.
    # В production-стадии Dockerfile нет ни src/, ни tsconfig.json, поэтому tsc
    # падает в справку и контейнер уходит в рестарт-луп. Код уже собран на
    # builder-стадии - просто запускаем его.
    working_dir: /bot
    command: ["node", "/bot/build/index.js"]
    ports: !reset []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    container_name: support-bot-mongo
    ports: !override
      - "127.0.0.1:27017:27017"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # поднимается только явно: docker compose --profile signal up -d signal-cli
  signal-cli:
    profiles: ["signal"]

  # поднимается только явно: docker compose --profile debug up -d mongo-express
  mongo-express:
    profiles: ["debug"]
    ports: !override
      - "127.0.0.1:8081:8081"

networks:
  shm-cabinet:
    external: true
